<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/app-icon-180.png">
  <meta name="theme-color" content="#ffffff">
  <title>대시보드 — 건강지킴이</title>
  <link rel="icon" type="image/png" href="images/ongil-symbol.png">
  <meta name="description" content="나의 운동 통계 대시보드. 주간/월간 운동 차트와 목표 달성률을 확인하세요.">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* Streak section */
    .streak-section {
      display: flex;
      align-items: center;
      gap: 16px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      color: white;
      margin-bottom: 20px;
    }
    .streak-flame {
      font-size: 3rem;
      line-height: 1;
      animation: flamePulse 1.5s ease-in-out infinite;
    }
    @keyframes flamePulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.1) rotate(-5deg); }
    }
    .streak-info h2 {
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255,255,255,0.65);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .streak-info .streak-count {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      margin: 2px 0;
    }
    .streak-info p {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.6);
    }
    .streak-cta {
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Hero stats */
    .hero-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .personal-report {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 22px;
      margin-bottom: 20px;
    }
    .report-heading { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:16px; }
    .report-heading h2 { font-size:1.08rem; font-weight:850; color:var(--text); }
    .report-heading p { margin-top:4px; font-size:.78rem; color:var(--text-muted); }
    .report-actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .report-period, .report-action { background:var(--surface-2); color:var(--primary); border:1px solid var(--border); border-radius:100px; padding:6px 10px; font:inherit; font-size:.72rem; font-weight:800; white-space:nowrap; }
    .report-action { cursor:pointer; }
    .report-action:hover, .report-action:focus-visible { border-color:var(--primary); outline:none; }
    .report-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .report-metric { padding:14px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface-2); }
    .report-metric-label { font-size:.7rem; color:var(--text-muted); font-weight:700; }
    .report-metric-value { margin-top:5px; color:var(--text); font-size:1.15rem; font-weight:900; }
    .report-metric-note { margin-top:3px; color:var(--text-secondary); font-size:.68rem; }
    .report-insights { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
    .report-insight { padding:12px 14px; border-left:3px solid var(--primary); border-radius:0 var(--radius-sm) var(--radius-sm) 0; background:#f7f9fc; color:var(--text-secondary); font-size:.8rem; line-height:1.55; }
    .report-disclaimer { margin-top:12px; color:var(--text-muted); font-size:.68rem; }
    .achievement-badges { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .achievement-badge { display:inline-flex; align-items:center; gap:6px; padding:8px 11px; border:1px solid var(--border); border-radius:100px; background:#fff; color:var(--text-secondary); font-size:.74rem; font-weight:750; }
    .achievement-badge.earned { border-color:rgba(0,77,191,.24); background:#eff5fc; color:var(--primary); }
    .inbody-report { margin-top:12px; padding:13px 14px; border-radius:var(--radius-md); background:#f5f6f8; color:var(--text-secondary); font-size:.78rem; line-height:1.55; }

    .consult-report-dialog {
      position: fixed;
      inset: 0;
      z-index: 2100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(15, 23, 42, .48);
      backdrop-filter: blur(5px);
    }
    .consult-report-dialog.open { display: flex; }
    .consult-report-panel {
      width: min(520px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding: 24px;
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(15, 23, 42, .24);
    }
    .consult-report-panel h2 { color:var(--text); font-size:1.12rem; font-weight:900; }
    .consult-report-panel > p { margin-top:6px; color:var(--text-muted); font-size:.78rem; line-height:1.55; }
    .consult-option-group { margin-top:18px; }
    .consult-option-title { display:block; margin-bottom:8px; color:var(--text-secondary); font-size:.78rem; font-weight:800; }
    .consult-month-input { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; color:var(--text); font:inherit; }
    .privacy-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .privacy-option { display:flex; align-items:flex-start; gap:8px; padding:10px 11px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2); color:var(--text-secondary); font-size:.76rem; cursor:pointer; }
    .privacy-option input { margin-top:2px; accent-color:var(--primary); }
    .privacy-note { margin-top:9px; padding:10px 12px; border-radius:var(--radius-sm); background:#f3f7fb; color:var(--text-muted); font-size:.7rem; line-height:1.5; }
    .consult-dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }

    .consult-report-sheet { display:none; color:#172033; background:#fff; font-family:'Pretendard','Noto Sans KR',sans-serif; }
    .consult-report-header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding-bottom:14px; border-bottom:2px solid #0b5797; }
    .consult-report-logo { width:285px; height:auto; object-fit:contain; }
    .consult-report-title { text-align:right; }
    .consult-report-title h1 { color:#17324d; font-size:22px; font-weight:900; letter-spacing:-.03em; }
    .consult-report-title p { margin-top:5px; color:#66788a; font-size:10px; }
    .consult-report-meta { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:13px; }
    .consult-meta-item { min-height:44px; padding:8px 10px; border:1px solid #dbe3eb; border-radius:7px; background:#f8fafc; }
    .consult-meta-label { color:#78899a; font-size:8px; font-weight:700; }
    .consult-meta-value { margin-top:4px; color:#172033; font-size:10px; font-weight:800; word-break:break-all; }
    .consult-report-section { margin-top:14px; }
    .consult-section-title { display:flex; align-items:center; gap:7px; margin-bottom:8px; color:#17324d; font-size:11px; font-weight:900; }
    .consult-section-title::before { content:''; width:3px; height:13px; border-radius:3px; background:#0b5797; }
    .consult-summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .consult-summary-card { padding:10px; border:1px solid #dbe3eb; border-radius:7px; }
    .consult-summary-card span { color:#78899a; font-size:8px; font-weight:700; }
    .consult-summary-card strong { display:block; margin-top:4px; color:#17324d; font-size:17px; font-weight:900; }
    .consult-summary-card small { display:block; margin-top:3px; color:#66788a; font-size:7px; }
    .consult-chart-grid { display:grid; grid-template-columns:1.2fr 1fr; gap:10px; }
    .consult-chart-card { min-width:0; padding:10px; border:1px solid #dbe3eb; border-radius:7px; break-inside:avoid; }
    .consult-chart-card h3 { margin-bottom:7px; color:#33485e; font-size:9px; font-weight:850; }
    .consult-chart-svg { display:block; width:100%; height:auto; overflow:visible; }
    .consult-inbody-metric + .consult-inbody-metric { margin-top:7px; }
    .consult-inbody-heading { display:flex; justify-content:space-between; gap:8px; margin-bottom:3px; color:#53687c; font-size:8px; }
    .consult-inbody-heading strong { color:#17324d; font-size:8px; }
    .consult-report-insight { padding:10px 12px; border-left:3px solid #0b5797; border-radius:0 7px 7px 0; background:#f3f7fb; color:#43586d; font-size:9px; line-height:1.55; }
    .consult-report-table { width:100%; border-collapse:collapse; font-size:8px; }
    .consult-report-table th { padding:6px; border-bottom:1px solid #cfd9e3; background:#f3f7fb; color:#53687c; text-align:left; }
    .consult-report-table td { padding:6px; border-bottom:1px solid #e7edf2; color:#33485e; }
    .consult-report-footer { display:flex; justify-content:space-between; gap:20px; margin-top:14px; padding-top:9px; border-top:1px solid #dbe3eb; color:#78899a; font-size:7px; line-height:1.5; }

    @media (max-width: 600px) {
      .hero-stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .streak-section { flex-direction: column; text-align: center; gap: 12px; padding: 16px; }
      .streak-cta { margin-left: 0; width: 100%; }
      .streak-cta .btn { width: 100%; }
      .streak-flame { font-size: 2.2rem; }
      .streak-info .streak-count { font-size: 2.2rem; }
    }

    /* ── 개인 운동 현황 그리드 ── */
    .custom-ex-chart-grid {
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 20px;
      align-items: stretch;
      min-width: 0;
      width: 100%;
    }

    .custom-ex-chart-wrap {
      height: 360px;
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }

    .custom-ex-summary {
      height: 360px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      padding: 16px;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    @media (max-width: 900px) {
      .custom-ex-chart-grid {
        grid-template-columns: 1fr;
      }
      .custom-ex-chart-wrap {
        height: 280px !important;
      }
      .custom-ex-summary {
        height: auto;
        max-height: 220px;
      }
    }

    @media (max-width: 600px) {
      .custom-ex-chart-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .custom-ex-chart-wrap {
        height: 260px !important;
      }
      .custom-ex-summary {
        height: auto;
        max-height: 200px;
        padding: 12px;
        font-size: 0.82rem;
      }
    }

    /* Weekly checklist */
    .week-grid {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .week-day {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .week-day-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .week-day-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.3s;
      position: relative;
    }
    .week-day-dot.done {
      background: var(--primary);
      color: white;
      box-shadow: 0 3px 10px rgba(0,77,191,0.3);
    }
    .week-day-dot.today {
      border: 2px solid var(--gold);
    }
    .week-day-dot.done.today {
      background: var(--gold);
      color: var(--primary-dark);
      border-color: var(--gold);
      box-shadow: 0 3px 10px rgba(0,153,255,0.4);
    }
    .week-date-label {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* Goal rings */
    .goal-rings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 16px;
    }
    .goal-ring-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .ring-canvas-wrap {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .ring-canvas-wrap canvas {
      width: 80px !important;
      height: 80px !important;
    }
    .ring-center-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .ring-pct {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
    }
    .ring-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }
    .ring-val {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Chart cards */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    .chart-card-header {
      padding: 18px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chart-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-card-body {
      padding: 16px 20px 20px;
    }

    /* Filter buttons */
    .filter-btns {
      display: flex;
      gap: 4px;
    }
    .filter-btn {
      padding: 5px 12px;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }


    /* Best records — 가로 그리드 */
    .best-records-list {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }
    .best-record-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      padding: 18px 12px 14px;
      background: var(--surface-2);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .best-record-item:hover {
      border-color: rgba(0,77,191,0.2);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }
    .best-record-icon-bg {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--surface-3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    .best-record-info { width: 100%; }
    .best-record-date {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .best-record-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .best-record-unit { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
    .best-record-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    @media (max-width: 900px) {
      .best-records-list { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .best-records-list { grid-template-columns: repeat(2, 1fr); }
    }

    /* Recent activity */
    .activity-list { display: flex; flex-direction: column; gap: 8px; }
    .activity-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      transition: background 0.15s;
      cursor: pointer;
      text-decoration: none;
    }
    .activity-row:hover { background: var(--surface-2); }
    .activity-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }
    .activity-date { font-size: 0.82rem; color: var(--text-secondary); min-width: 90px; }
    .activity-summary { font-size: 0.82rem; color: var(--text); flex: 1; }
    .activity-cond { font-size: 0.78rem; }

    /* No data placeholder */
    .chart-no-data {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 180px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .chart-no-data .no-data-icon { font-size: 2.5rem; margin-bottom: 8px; opacity: 0.4; }

    /* ── Month Navigator ── */
    .month-nav-btn {
      width: 30px; height: 30px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      cursor: pointer;
      font-size: 0.72rem;
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .month-nav-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(0,77,191,0.05);
    }

    /* ── Monthly Calendar ── */
    .cal-hdr-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 4px;
    }
    .cal-hdr {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 0;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 1fr;
      gap: 3px;
    }
    .cal-cell {
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      position: relative;
      transition: all 0.15s;
    }
    .cal-cell.cal-has {
      background: rgba(0,77,191,0.07);
      cursor: pointer;
    }
    .cal-cell.cal-has:hover {
      background: rgba(0,77,191,0.14);
      transform: scale(1.06);
    }
    .cal-cell.cal-today {
      border: 2px solid var(--gold);
    }
    .cal-cell.cal-future { opacity: 0.3; pointer-events: none; }
    .cal-num {
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1;
      color: var(--text-secondary);
    }
    .cal-cond-emoji { font-size: 0.68rem; line-height: 1; }
    .cal-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--primary);
    }
    /* 범례 */
    .cal-legend {
      display: inline-block;
      width: 12px; height: 12px;
      border-radius: 4px;
      vertical-align: middle;
      margin-right: 2px;
    }
    .cal-legend.cal-has  { background: rgba(0,77,191,0.12); border: 1px solid rgba(0,77,191,0.2); }
    .cal-legend.cal-today { border: 2px solid var(--gold); }

    @media (max-width: 900px) {
      .hero-stats-grid { grid-template-columns: repeat(2, 1fr); }
      .goal-rings-grid { grid-template-columns: repeat(4, 1fr); }
      #monthlyView > div { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 600px) {
      .hero-stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .goal-rings-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .ring-canvas-wrap { width: 64px; height: 64px; }
      .ring-canvas-wrap canvas { width: 64px !important; height: 64px !important; }
      .ring-pct { font-size: 0.8rem; }
      .ring-label { font-size: 0.65rem; }
      .best-records-list { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .best-record-item { padding: 14px 10px 12px; }
      .chart-wrap { height: 160px; }
      .chart-card-header { flex-wrap: wrap; gap: 8px; }
      .chart-card-header .filter-btns { margin-left: 0; }
      .week-grid { gap: 4px; }
      .week-day-dot { width: 30px; height: 30px; font-size: 0.7rem; }
      .week-day-label { font-size: 0.65rem; }
      .week-date-label { font-size: 0.6rem; }
      .activity-date { min-width: 70px; font-size: 0.78rem; }
      .activity-summary { font-size: 0.78rem; }
      .personal-report { padding:16px; }
      .report-heading { flex-direction:column; }
      .report-metrics { grid-template-columns:repeat(2,1fr); }
      .report-insights { grid-template-columns:1fr; }
      .privacy-options { grid-template-columns:1fr; }
    }

    @page { size:A4 portrait; margin:10mm; }

    @media print {
      body.print-personal-report .top-nav,
      body.print-personal-report .app-footer,
      body.print-personal-report #mainContent > * { display:none !important; }
      body.print-personal-report #mainContent,
      body.print-personal-report #mainContent > .personal-report { display:block !important; }
