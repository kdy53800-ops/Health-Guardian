<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/app-icon-180.png">
  <meta name="theme-color" content="#ffffff">
  <title>Health Guardian — 샘플 데이터 주입</title>
  <link rel="icon" type="image/png" href="images/ongil-symbol.png">
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; background: #f0f4f8; }
    .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 4px 20px rgba(0,77,191,0.12); }
    h2 { color: #004DBF; margin-bottom: 8px; }
    p  { color: #5a7a9a; font-size: 0.9rem; margin-bottom: 20px; }
    button { background: #004DBF; color: white; border: none; padding: 12px 28px;
             border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; }
    button:hover { background: #0068D9; }
    #result { margin-top: 20px; padding: 14px; border-radius: 10px; font-size: 0.9rem; display: none; }
    .success { background: rgba(34,197,94,0.1); color: #15803d; border: 1px solid rgba(34,197,94,0.3); }
    .error   { background: rgba(239,68,68,0.1); color: #b91c1c; border: 1px solid rgba(239,68,68,0.3); }
    .record-list { margin-top: 10px; }
    .record-item { padding: 5px 0; border-bottom: 1px solid rgba(0,77,191,0.1); font-size: 0.82rem; color: #003A91; }
    a.go-btn { display: block; text-align: center; margin-top: 14px; padding: 10px;
               background: #0099FF; color: #003A91; font-weight: 700; border-radius: 10px;
               text-decoration: none; font-size: 0.9rem; }
  </style>
  <link rel="stylesheet" href="css/ongil-theme.css">
</head>
<body>
  <div class="card">
    <h2>🌱 샘플 데이터 주입</h2>
    <p>현재 로그인된 계정에 5개의 예시 기록을 추가합니다.<br>
    이미 같은 날짜 기록이 있으면 건너뜁니다.</p>
    <button onclick="injectData()">▶ 샘플 데이터 추가하기</button>
    <div id="result"></div>
  </div>

  <script src="js/seed-data.js"></script>
</body>
</html>
